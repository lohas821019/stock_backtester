name: 0050 / 0052 盤中實時進場雷達 (Live Intraday Radar)

on:
  schedule:
    # 台灣時間週一至週五 08:50 (UTC 00:50) 啟動實時盯盤守護行程（常駐巡檢至 13:35 收盤）
    - cron: '50 0 * * 1-5'
    # 備援啟動：09:05 (UTC 01:05)，防止 08:50 因 GitHub 排程隊列偶發延遲
    - cron: '5 1 * * 1-5'
    # 收盤大總結推播：13:38 (UTC 05:38)
    - cron: '38 5 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵隨時啟動實時雷達

concurrency:
  group: intraday-radar-live
  cancel-in-progress: false

jobs:
  live-radar-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 最長允許 6 小時 (盤中僅需 4.5 小時)
    steps:
      - name: 簽出專案代碼 (Checkout repository)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝專案相依套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 執行盤中實時雷達守護行程 (Run Live Intraday Radar Daemon)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TW_HOUR=$(TZ=Asia/Taipei date +%H)
          TW_MIN=$(TZ=Asia/Taipei date +%M)
          echo "當前台灣時間: ${TW_HOUR}:${TW_MIN}"
          
          # 若為收盤時段 (13:35 之後)，發送收盤大總結
          if [ "$TW_HOUR" -gt 13 ] || ([ "$TW_HOUR" -eq 13 ] && [ "$TW_MIN" -ge 35 ]); then
            echo "📊 收盤結算時段：執行收盤大總結推播..."
            python -m stock_backtester.cli watch-live --stocks 0050,0052 --notify --summary --once
          else
            echo "⚡ 盤中交易時段：啟動連續即時盯盤守護行程（每 60 秒巡檢，碰價即刻發送 Telegram 急報，每日上限 5 次）..."
            python -m stock_backtester.cli watch-live --stocks 0050,0052 --notify --summary --interval 60 --max-alerts 5 --cooldown 180 --daemon
          fi

