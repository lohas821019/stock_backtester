name: 0050 盤中與收盤進場雷達推播 (Intraday Radar)

on:
  schedule:
    # 台灣時間週一至週五 09:00 ~ 13:30 (UTC 01:00 ~ 05:30) 每 15 分鐘巡檢一次
    # 包含 13:40 (UTC 05:40) 收盤大總結推播
    - cron: '*/15 1-5 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊立即測試

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案代碼 (Checkout repository)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝專案相依套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 執行 0050 盤中與收盤即時雷達檢測並推播 Telegram (Run Radar Check)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TW_HOUR=$(TZ=Asia/Taipei date +%H)
          TW_MIN=$(TZ=Asia/Taipei date +%M)
          echo "當前台灣時間: ${TW_HOUR}:${TW_MIN}"
          # 若為下午 13:35 之後（收盤時段），發送今日收盤大總結；盤中則維持靜默巡檢（僅觸碰信號時推播）
          if [ "$TW_HOUR" -eq 13 ] && [ "$TW_MIN" -ge 35 ] || [ "$TW_HOUR" -ge 14 ]; then
            echo "📊 收盤結算時段：執行收盤總結推播..."
            python -m stock_backtester.cli watch-entry --stock 0050 --notify --summary
          else
            echo "⚡ 盤中交易時段：執行即時觸碰巡檢（未觸發信號時保持靜默）..."
            python -m stock_backtester.cli watch-entry --stock 0050 --notify
          fi
