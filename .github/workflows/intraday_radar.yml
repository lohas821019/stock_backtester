name: 0050 / 0052 盤中實時進場雷達 (Live Intraday Radar)

# ────────────────────────────────────────────────────────────
# 架構說明：
#   採用「高頻短任務」模式，每 5 分鐘觸發一次獨立的單次檢測，
#   取代原本的「單一 daemon 常駐 5 小時」模式。
#
#   原因：GitHub Actions cron 為「盡力而為」(best-effort)，
#   對 UTC 凌晨時段（台灣早盤 08:50~09:05）的排程可靠性極低，
#   歷史記錄顯示 08:50 / 09:05 的 cron 觸發率為 0%。
#
#   改為每 5 分鐘短任務後：
#   - 即使偶爾被跳過，5 分鐘後又會重試
#   - 每次僅執行 1~2 分鐘，不長時間佔用 runner
#   - 狀態透過 GitHub Actions Cache 跨次持久化
# ────────────────────────────────────────────────────────────

on:
  schedule:
    # 台灣時間 09:00~13:40 每 5 分鐘觸發 (UTC 01:00~05:40)
    # 覆蓋：開盤打卡 (09:00)、盤中巡檢 (09:00~13:30)、收盤總結 (13:35)
    - cron: '*/5 1-5 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵隨時啟動

concurrency:
  group: intraday-radar-live
  cancel-in-progress: true  # 新的 run 直接取代舊的，避免排隊卡住

jobs:
  live-radar-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 單次檢測只需 1~2 分鐘

    steps:
      - name: 簽出專案代碼 (Checkout repository)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝專案相依套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 還原今日雷達狀態快取 (Restore radar state)
        uses: actions/cache/restore@v4
        with:
          path: ~/.stock_backtester
          key: radar-state-will-not-match
          restore-keys: |
            radar-state-

      - name: 執行盤中實時雷達單次檢測 (Run Live Radar - single check)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TW_TIME=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')
          echo "🕐 當前台灣時間: ${TW_TIME}"
          echo "⚡ 啟動單次檢測模式（自動根據時段執行開盤打卡/碰價檢測/收盤總結）..."
          python -m stock_backtester.cli -v watch-live --stocks 0050,0052 --notify --summary --once

      - name: 儲存今日雷達狀態快取 (Save radar state)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.stock_backtester
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}
