[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-backtester"
version = "0.1.0"
description = "可擴展的台股 + 美股回測框架，支援策略插件機制"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "yfinance>=0.2",
    "ta>=0.11",              # 純 Python 技術指標
    "sqlalchemy>=2.0",
    "pyarrow>=14.0",
    "click>=8.1",
    "rich>=13.0",
    "plotly>=5.18",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.18",
]

sinopac = [
    # 永豐金證券 API（免費模擬帳號）
    # 申請：https://www.sinotrade.com.tw/ec/20180901/
    # 安裝後編輯 data/fetchers/sinopac_fetcher.py 填入 api_key / secret_key
    "shioaji>=1.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]


[project.scripts]
backtest = "stock_backtester.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["stock_backtester"]
